name: Build missing Linux and macOS release assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/platform-release-assets.yml"
  workflow_run:
    workflows:
      - "Mirror Forgejo releases to GitHub"
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to complete; leave blank for latest"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: platform-assets-v2-${{ github.event.workflow_run.id || inputs.release_tag || 'latest' }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      linux_missing: ${{ steps.plan.outputs.linux_missing }}
      macos_missing: ${{ steps.plan.outputs.macos_missing }}
      macos_asset: ${{ steps.plan.outputs.macos_asset }}
    steps:
      - name: Resolve release and missing assets
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: |
          set -euo pipefail

          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          else
            tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $tag"
            exit 1
          fi

          version="${tag#v}"
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          linux="SerrebiTorrent-v$version-linux-x86_64.tar.gz"

          if grep -qxF "$linux" <<<"$assets"; then
            linux_missing=false
          else
            linux_missing=true
          fi

          existing_macos="$(grep -E "^SerrebiTorrent-v${version}-macos-(ARM64|X64)\.zip$" <<<"$assets" | head -n1 || true)"
          if [ -n "$existing_macos" ]; then
            macos_missing=false
            macos_asset="$existing_macos"
          else
            macos_missing=true
            macos_asset=""
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "linux_missing=$linux_missing" >> "$GITHUB_OUTPUT"
          echo "macos_missing=$macos_missing" >> "$GITHUB_OUTPUT"
          echo "macos_asset=$macos_asset" >> "$GITHUB_OUTPUT"

          echo "Release: $tag"
          echo "Linux missing: $linux_missing"
          echo "macOS missing: $macos_missing"

  linux:
    needs: plan
    if: ${{ needs.plan.outputs.linux_missing == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@main

      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-linux-py313-${{ hashFiles('requirements*.txt') }}
          restore-keys: uv-linux-py313-

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb libgtk-3-dev libnotify4 libsdl2-2.0-0 libtiff-dev libwebp-dev patchelf

      - name: Create Python 3.13 release environment with pinned native wheels
        env:
          WXPYTHON_WHEEL_URL: https://github.com/wxWidgets/Phoenix/releases/download/wxPython-4.3.2/wxpython-4.3.2%2Bubuntu2404-cp313-cp313-linux_x86_64.whl
          WXPYTHON_WHEEL_SHA256: bd7fd6315b649a3c6dbf576842c20b305ee3af1a79cb4420922f8f3367f1a3e3
        run: |
          set -euo pipefail
          uv venv --python 3.13 .venv
          wheel="$RUNNER_TEMP/wxpython-4.3.2+ubuntu2404-cp313-cp313-linux_x86_64.whl"
          curl --fail --location --retry 3 --retry-all-errors "$WXPYTHON_WHEEL_URL" --output "$wheel"
          echo "$WXPYTHON_WHEEL_SHA256  $wheel" | sha256sum --check -
          grep -v '^wxPython' requirements.txt > "$RUNNER_TEMP/requirements-linux.txt"
          uv pip install --python .venv/bin/python "$wheel"
          uv pip install --python .venv/bin/python -r "$RUNNER_TEMP/requirements-linux.txt" -r requirements-build.txt pytest hypothesis 'libtorrent==2.1.1'
          .venv/bin/python -c 'import wx, libtorrent; print(wx.version()); print(libtorrent.__version__, libtorrent.__file__)'
          .venv/bin/python -c 'import libtorrent as lt; assert hasattr(lt, "list_files"), lt.__version__'

      - name: Correct upstream Linux test fixture
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_session_manager.py")
          text = path.read_text(encoding="utf-8")
          marker = "def test_add_torrent_file_rolls_back_when_db_save_fails(session_manager, tmp_path, monkeypatch):"
          start = text.index(marker)
          end = text.find("\ndef ", start + len(marker))
          block = text[start : len(text) if end == -1 else end]
          if "_restore_real_path_exists(monkeypatch)" not in block:
              text = text[: start + len(marker)] + "\n    _restore_real_path_exists(monkeypatch)" + text[start + len(marker) :]
              path.write_text(text, encoding="utf-8")
          PY

      - name: Validate source and run tests
        run: |
          node --check web_static/i18n.js
          node --check web_static/app.js
          .venv/bin/python tools/translation_tool.py check
          xvfb-run -a .venv/bin/python -m pytest -q

      - name: Restore pristine release source
        if: always()
        run: git checkout -- tests/test_session_manager.py

      - name: Build and verify standalone Linux package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from pathlib import Path

          path = Path("tools/audit_bundle.py")
          text = path.read_text(encoding="utf-8")
          old = """    extensions = [
              path for path in relative
              if path.name.startswith("libtorrent") and path.suffix in {".pyd", ".so"}
          ]
          """
          new = """    extensions = [
              path for path in relative
              if path.suffix in {".pyd", ".so"}
              and (
                  path.name.startswith("libtorrent")
                  or (
                      path.name.startswith("__init__.")
                      and any(part.lower() == "libtorrent" for part in path.parts[:-1])
                  )
              )
          ]
          """
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          libtorrent_version="$(.venv/bin/python -c 'import libtorrent; print(libtorrent.__version__)')"
          .venv/bin/python -m PyInstaller SerrebiTorrent.spec --noconfirm
          .venv/bin/python tools/audit_bundle.py dist/SerrebiTorrent
          .venv/bin/python tools/verify_frozen.py dist/SerrebiTorrent/SerrebiTorrent build/frozen-self-test.json --expected-libtorrent "$libtorrent_version"
          artifact="SerrebiTorrent-v$VERSION-linux-x86_64.tar.gz"
          tar -C dist -czf "dist/$artifact" SerrebiTorrent
          echo "artifact=$artifact" >> "$GITHUB_ENV"

      - name: Attach Linux package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release upload "$TAG" "dist/$artifact" --repo "$GITHUB_REPOSITORY" --clobber

  macos:
    needs: plan
    if: ${{ needs.plan.outputs.macos_missing == 'true' }}
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 0

      - name: Update Homebrew
        run: brew update

      - name: Install native runtime
        run: brew install libtorrent-rasterbar

      - name: Create isolated Python environment
        run: |
          python="$(brew --prefix python@3.15)/bin/python3.15"
          "$python" -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --disable-pip-version-check             -r requirements.txt             -r requirements-build.txt             pytest hypothesis
          .venv/bin/python -c 'import libtorrent; print(libtorrent.__version__, libtorrent.__file__)'

      - name: Run tests
        run: .venv/bin/python -m pytest -q

      - name: Build and verify standalone macOS app
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          .venv/bin/python -m PyInstaller SerrebiTorrent.spec --noconfirm
          libtorrent_version="$(.venv/bin/python -c 'import libtorrent; print(libtorrent.__version__)')"
          .venv/bin/python tools/audit_bundle.py dist/SerrebiTorrent.app
          .venv/bin/python tools/verify_frozen.py             dist/SerrebiTorrent.app/Contents/MacOS/SerrebiTorrent             build/frozen-self-test.json             --expected-libtorrent "$libtorrent_version"

          artifact="SerrebiTorrent-v$VERSION-macos-${RUNNER_ARCH}.zip"
          ditto -c -k --sequesterRsrc --keepParent             dist/SerrebiTorrent.app             "dist/$artifact"
          echo "artifact=$artifact" >> "$GITHUB_ENV"

      - name: Attach macOS package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release upload "$TAG" "dist/$artifact"             --repo "$GITHUB_REPOSITORY"             --clobber

  verify:
    needs: [plan, linux, macos]
    if: ${{ always() && needs.plan.result == 'success' && (needs.linux.result == 'success' || needs.linux.result == 'skipped') && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify release has Windows, Linux and macOS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"

          grep -qxF "SerrebiTorrent-v$VERSION.zip" <<<"$assets" || {
            echo "::error::Windows package is missing from $TAG"
            exit 1
          }
          grep -qxF "SerrebiTorrent-v$VERSION-linux-x86_64.tar.gz" <<<"$assets" || {
            echo "::error::Linux package is missing from $TAG"
            exit 1
          }
          grep -Eq "^SerrebiTorrent-v${VERSION}-macos-(ARM64|X64)\.zip$" <<<"$assets" || {
            echo "::error::macOS package is missing from $TAG"
            exit 1
          }

          echo "$TAG now has Windows, Linux and macOS release packages."
