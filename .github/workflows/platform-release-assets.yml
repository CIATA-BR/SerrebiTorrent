name: Build missing Linux and macOS release assets

on:
  workflow_run:
    workflows:
      - "Mirror Forgejo releases to GitHub"
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to complete; leave blank for latest"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: platform-assets-${{ github.event.workflow_run.id || inputs.release_tag || 'latest' }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      linux_missing: ${{ steps.plan.outputs.linux_missing }}
      macos_missing: ${{ steps.plan.outputs.macos_missing }}
      macos_asset: ${{ steps.plan.outputs.macos_asset }}
    steps:
      - name: Resolve release and missing assets
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
        run: |
          set -euo pipefail

          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          else
            tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $tag"
            exit 1
          fi

          version="${tag#v}"
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          linux="SerrebiTorrent-v$version-linux-x86_64.tar.gz"

          if grep -qxF "$linux" <<<"$assets"; then
            linux_missing=false
          else
            linux_missing=true
          fi

          existing_macos="$(grep -E "^SerrebiTorrent-v${version}-macos-(ARM64|X64)\.zip$" <<<"$assets" | head -n1 || true)"
          if [ -n "$existing_macos" ]; then
            macos_missing=false
            macos_asset="$existing_macos"
          else
            macos_missing=true
            macos_asset=""
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "linux_missing=$linux_missing" >> "$GITHUB_OUTPUT"
          echo "macos_missing=$macos_missing" >> "$GITHUB_OUTPUT"
          echo "macos_asset=$macos_asset" >> "$GITHUB_OUTPUT"

          echo "Release: $tag"
          echo "Linux missing: $linux_missing"
          echo "macOS missing: $macos_missing"

  linux:
    needs: plan
    if: ${{ needs.plan.outputs.linux_missing == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 0

      - name: Install native runtime and build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y             python3-venv             python3-dev             python3-wxgtk4.0             python3-libtorrent             xvfb             libgtk-3-dev             libtiff-dev             libwebp-dev             patchelf

      - name: Create isolated release environment
        run: |
          python3 -m venv --system-site-packages .venv
          grep -v -E '^(wxPython)$' requirements.txt > /tmp/requirements-linux.txt
          .venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .venv/bin/python -m pip install --disable-pip-version-check             -r /tmp/requirements-linux.txt             -r requirements-build.txt             pytest hypothesis
          .venv/bin/python -c 'import wx, libtorrent; print(wx.version()); print(libtorrent.__version__, libtorrent.__file__)'

      - name: Validate source and run tests
        run: |
          node --check web_static/i18n.js
          node --check web_static/app.js
          .venv/bin/python tools/translation_tool.py check
          xvfb-run -a .venv/bin/python -m pytest -q

      - name: Build and verify standalone Linux package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          libtorrent_version="$(.venv/bin/python -c 'import libtorrent; print(libtorrent.__version__)')"

          .venv/bin/python -m PyInstaller SerrebiTorrent.spec --noconfirm
          .venv/bin/python tools/audit_bundle.py dist/SerrebiTorrent
          .venv/bin/python tools/verify_frozen.py             dist/SerrebiTorrent/SerrebiTorrent             build/frozen-self-test.json             --expected-libtorrent "$libtorrent_version"

          artifact="SerrebiTorrent-v$VERSION-linux-x86_64.tar.gz"
          tar -C dist -czf "dist/$artifact" SerrebiTorrent
          echo "artifact=$artifact" >> "$GITHUB_ENV"

      - name: Attach Linux package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release upload "$TAG" "dist/$artifact"             --repo "$GITHUB_REPOSITORY"             --clobber

  macos:
    needs: plan
    if: ${{ needs.plan.outputs.macos_missing == 'true' }}
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 0

      - name: Update Homebrew
        run: brew update

      - name: Install native runtime
        run: brew install libtorrent-rasterbar

      - name: Create isolated Python environment
        run: |
          python="$(brew --prefix python@3.15)/bin/python3.15"
          "$python" -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --disable-pip-version-check             -r requirements.txt             -r requirements-build.txt             pytest hypothesis
          .venv/bin/python -c 'import libtorrent; print(libtorrent.__version__, libtorrent.__file__)'

      - name: Run tests
        run: .venv/bin/python -m pytest -q

      - name: Build and verify standalone macOS app
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          .venv/bin/python -m PyInstaller SerrebiTorrent.spec --noconfirm
          libtorrent_version="$(.venv/bin/python -c 'import libtorrent; print(libtorrent.__version__)')"
          .venv/bin/python tools/audit_bundle.py dist/SerrebiTorrent.app
          .venv/bin/python tools/verify_frozen.py             dist/SerrebiTorrent.app/Contents/MacOS/SerrebiTorrent             build/frozen-self-test.json             --expected-libtorrent "$libtorrent_version"

          artifact="SerrebiTorrent-v$VERSION-macos-${RUNNER_ARCH}.zip"
          ditto -c -k --sequesterRsrc --keepParent             dist/SerrebiTorrent.app             "dist/$artifact"
          echo "artifact=$artifact" >> "$GITHUB_ENV"

      - name: Attach macOS package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release upload "$TAG" "dist/$artifact"             --repo "$GITHUB_REPOSITORY"             --clobber

  verify:
    needs: [plan, linux, macos]
    if: ${{ always() && needs.plan.result == 'success' && (needs.linux.result == 'success' || needs.linux.result == 'skipped') && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify release has Windows, Linux and macOS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"

          grep -qxF "SerrebiTorrent-v$VERSION.zip" <<<"$assets" || {
            echo "::error::Windows package is missing from $TAG"
            exit 1
          }
          grep -qxF "SerrebiTorrent-v$VERSION-linux-x86_64.tar.gz" <<<"$assets" || {
            echo "::error::Linux package is missing from $TAG"
            exit 1
          }
          grep -Eq "^SerrebiTorrent-v${VERSION}-macos-(ARM64|X64)\.zip$" <<<"$assets" || {
            echo "::error::macOS package is missing from $TAG"
            exit 1
          }

          echo "$TAG now has Windows, Linux and macOS release packages."
