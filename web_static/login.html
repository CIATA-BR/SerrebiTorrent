<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SerrebiTorrent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { width: 400px; padding: 2rem; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white; border-top: 5px solid #007bff; }
        .logo { text-align: center; margin-bottom: 1.5rem; color: #007bff; font-weight: bold; font-size: 1.5rem; }
    </style>
</head>
<body>
    <main class="login-card" aria-labelledby="login-title">
        <h1 class="logo" id="login-title">SerrebiTorrent</h1>
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label" data-i18n="username">Username</label>
                <input type="text" class="form-control" id="username" required autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label" data-i18n="password">Password</label>
                <input type="password" class="form-control" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-100" data-i18n="login">Login</button>
            <div id="errorMsg" class="text-danger mt-2 text-center" role="alert" aria-live="assertive" style="display:none;" data-i18n="invalid">Invalid credentials.</div>
        </form>
    </main>

    <script>
        (() => {
            const isPtBr = String(navigator.language || '').toLowerCase().replace('_', '-').startsWith('pt');
            if (!isPtBr) return;
            document.documentElement.lang = 'pt-BR';
            document.title = 'Entrar - SerrebiTorrent';
            const translations = {
                username: 'Nome de usuário',
                password: 'Senha',
                login: 'Entrar',
                invalid: 'Credenciais inválidas.'
            };
            document.querySelectorAll('[data-i18n]').forEach((element) => {
                const value = translations[element.dataset.i18n];
                if (value) element.textContent = value;
            });
        })();

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            const res = await fetch('/api/v2/auth/login', {
                method: 'POST',
                body: formData
            });

            if (res.ok) {
                window.location.href = '/';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        };
    </script>
</body>
</html>
